<ellipse class="n" cx="140" cy="22" rx="34" ry="12"/>
<text class="m" x="190" y="26">tendril</text>
<path class="e" d="M470,30 L488,68" marker-end="url(#bt-tip)"/>
<ellipse class="n" cx="452" cy="22" rx="34" ry="12"/>
<text class="m" x="364" y="26">tendril</text>
<ellipse class="n" cx="560" cy="282" rx="22" ry="9"/>
